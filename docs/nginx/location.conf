# facemarket-avatar-widget — location block to reverse-proxy this app at your domain's
# root (this app owns "/" entirely — e.g. its own subdomain, or a domain
# that isn't already running another site).
#
# Embedding just the widget into an EXISTING site that already owns "/" (and
# probably already has its own "/api/*")? Use location-api-prefix.conf
# instead — it exposes only the API, under a non-colliding custom prefix.
#
# This app is a single Node/Express process serving both the API (/api/*)
# and the frontend on one port (see docs/api.md) — there's nothing to split
# by path, one location block covers the whole thing.
#
# Include this INSIDE an existing server {} block that already handles
# listen/server_name/TLS for your domain, e.g.:
#
#   server {
#       listen 443 ssl;
#       server_name your-domain.example.com;
#       ... your existing ssl_certificate / other config ...
#
#       include /path/to/liveavatar/docs/nginx/location.conf;
#   }
#
# Requires upstream.conf (upstream + map) to already be included at the
# http {} level — see the comment in that file.
#
# NOT proxied here: the actual call media/signaling. POST /api/session/start
# returns an sfuUrl (wss://...) that the browser connects to DIRECTLY —
# straight to FaceMarket's SFU, never through this app or this nginx. So
# this only ever needs to carry plain HTTP request/response traffic; no
# WebRTC/media handling belongs here.
#
# REQUIRED companion change: /api/session/start is rate-limited per caller
# IP (see docs/api.md "Rate limiting"). For that limit to apply per real
# visitor instead of collapsing onto this proxy's own IP, the app must
# trust the X-Forwarded-For header set below. Set in the app's .env:
#
#   TRUST_PROXY=1
#
# ("1" = trust exactly one hop in front of the process, i.e. this nginx.
# Leave TRUST_PROXY unset if the app is ever run directly with nothing in
# front of it — trusting forwarded headers with no real proxy there would
# let any client spoof its own IP and dodge the rate limit entirely.)

location / {
    proxy_pass http://liveavatar_backend;
    proxy_http_version 1.1;

    # The app relies on these: Host for same-origin behavior, and
    # X-Forwarded-For for the rate limiter (see TRUST_PROXY note above).
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Standard nginx WebSocket-upgrade pair (via the $connection_upgrade map
    # in upstream.conf). Only exercised if you're proxying `npm run dev` —
    # Vite HMR uses a websocket back to this same origin. Production
    # (`npm start`) serves prebuilt static files and never opens this
    # connection, so it's a no-op there. Note this sends `Connection: close`
    # for ordinary (non-upgrade) requests, same as nginx's own documented
    # WebSocket proxy recipe — drop this pair, and the `keepalive` on the
    # upstream block, if you don't need HMR proxied and would rather keep
    # upstream connections alive instead.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_read_timeout 60s;
}
