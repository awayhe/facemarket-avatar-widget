# facemarket-avatar-widget — DEV variant: proxy the whole app (frontend + API) under a
# custom path prefix, e.g. /liveavatar — the same approach as location.conf,
# just not mounted at your domain's root. Plain passthrough, no rewriting:
# the app itself already understands this prefix natively (see below).
#
# Use this for `npm run dev` (Vite's dev middleware needs a live Node
# process for every request — HMR, on-the-fly module transforms, etc. — so
# it can't be served as static files). For `npm run build` + `npm start`,
# use location-static.conf instead: nginx serving the prebuilt files
# directly is strictly better than proxying them through Node once nothing
# needs to be transformed on the fly anymore.
#
# Set BASE_PATH=/liveavatar in the app's .env (see .env.example) — that one
# value makes index.js's own routes, the built asset URLs (via
# web/vite.config.js reading the same var), and this repo's own demo
# (web/src/main.js) all agree on this prefix automatically. Nothing to
# hand-edit per deployment; nginx doesn't need to rewrite anything either,
# since the app already expects to receive "/liveavatar/..." directly.
#
# Include this INSIDE your site's existing server {} block:
#
#   server {
#       listen 443 ssl;
#       server_name your-domain.example.com;
#       ...
#       include /path/to/liveavatar/docs/nginx/location-app-prefix.conf;
#   }
#
# Requires upstream.conf to already be included at the http {} level.

location /liveavatar/ {
    # No URI part on proxy_pass — passes /liveavatar/... straight through
    # unmodified. No rewrite needed: the backend's BASE_PATH (see above)
    # already makes it expect exactly this.
    proxy_pass http://liveavatar_backend;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Vite HMR websocket (dev mode only — see docs/nginx/location.conf).
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_read_timeout 60s;
}
