# liveavatar-poc — upstream + map definitions.
#
# `upstream` and `map` are only valid in nginx's http {} context, not inside
# a server {} block — so this file has to be included there, e.g. from your
# main nginx.conf's http {} block, or a file already included at that level
# (like conf.d/*.conf on many distros):
#
#   http {
#       ...
#       include /path/to/liveavatar/docs/nginx/upstream.conf;
#       ...
#   }
#
# The location block(s) that use this upstream are in sibling files — include
# whichever one matches your deployment inside your existing server {} block:
#
#   - location.conf             — proxy this whole app at your domain's root
#                                  (dev mode, `npm run dev`).
#   - location-app-prefix.conf  — proxy this whole app under a custom prefix
#                                  like /liveavatar (dev mode).
#   - location-static.conf      — same as location-app-prefix.conf, but for
#                                  the production build: nginx serves
#                                  web/dist/ directly instead of proxying it
#                                  through Node, and only /liveavatar/api/*
#                                  still goes to the backend.
#   - location-api-prefix.conf  — proxy only /api/* under a custom prefix,
#                                  for embedding the widget into an existing
#                                  site that already owns "/" (and probably
#                                  its own "/api/*").
#
# See whichever file you use for the rest of the notes (SFU/media bypass
# this proxy entirely, TRUST_PROXY requirement, etc).

upstream liveavatar_backend {
    # Match this port to PORT in your .env if you're not using the default.
    server 127.0.0.1:8787;
    keepalive 32;
}

# Only used by the optional WebSocket-upgrade lines in location.conf and
# location-app-prefix.conf.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
