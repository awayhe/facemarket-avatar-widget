# liveavatar-poc — alternative to location.conf: expose only the API under
# a custom path prefix, instead of proxying this whole app at your domain's
# root. Use this when embedding the FaceMarketWidget component into an
# EXISTING site that already owns "/" on its domain and likely already has
# its own "/api/*" routes for other things — mounting this app there too
# under the plain "/api/*" path would collide with those.
#
# Example below exposes it at /liveavatar/api/* instead of /api/*. Pick
# whatever prefix fits your site (e.g. /facemarket/api/*) — "liveavatar"
# here is just an example, not a required name.
#
# Include this INSIDE your site's existing server {} block, alongside
# whatever location blocks already handle the rest of your site:
#
#   server {
#       listen 443 ssl;
#       server_name your-existing-site.example.com;
#       ... your site's existing location blocks (including its own /api/*) ...
#
#       include /path/to/liveavatar/docs/nginx/location-api-prefix.conf;
#   }
#
# Requires upstream.conf to already be included at the http {} level — see
# that file. Unlike location.conf, this doesn't need the WebSocket-upgrade
# lines — /api/* is plain request/response JSON, never a websocket (Vite's
# HMR socket, the only thing that needs upgrading, lives under "/", which
# this file deliberately doesn't touch).
#
# The backend's own BASE_PATH env var (see .env.example) must be set to
# this same prefix, e.g. BASE_PATH=/liveavatar — that's what makes it
# understand "/liveavatar/api/..." requests natively, so nginx here can be
# a plain passthrough instead of needing to rewrite the path. (The backend
# only ever sees requests for this one location, /liveavatar/api/* — it
# never receives, and has no opinion about, whatever the existing site
# itself serves at /liveavatar or anywhere else.)
#
# On the frontend side, point the widget at this same prefix so its
# requests land here instead of at the plain "/api/*":
#
#   new FaceMarketWidget("#call-widget", { apiBaseUrl: "/liveavatar" });
#
# (apiBaseUrl is just prepended to request paths like "/api/avatars" — it
# doesn't have to be a different origin; a same-origin path prefix works
# exactly the same way.)
#
# Same TRUST_PROXY requirement as location.conf applies here too — see that
# file, or docs/api.md's "Rate limiting" section, for why.

location /liveavatar/api/ {
    # No URI part on proxy_pass — passes /liveavatar/api/... straight
    # through unmodified. No rewrite needed: the backend's BASE_PATH (see
    # above) already makes it expect exactly this path.
    proxy_pass http://liveavatar_backend;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 60s;
}
