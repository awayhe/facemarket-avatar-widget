# facemarket-avatar-widget — PRODUCTION variant: nginx serves the built static files
# directly (web/dist/, from `npm run build`) instead of proxying everything
# to the Node process. Only /liveavatar/api/* still goes to the backend —
# nginx is strictly better at serving static assets than a Node process
# proxying them through, so this is the recommended setup once you're past
# local dev.
#
# NOT usable in dev mode (`npm run dev`): Vite's dev server transforms
# modules and serves HMR on the fly — those responses don't exist as files
# on disk for nginx to serve. Use location.conf or location-app-prefix.conf
# (whichever matches your mount) for dev instead; switch to this one for
# `npm run build` + `npm start`.
#
# Set BASE_PATH=/liveavatar in the app's .env (see .env.example) and rebuild
# (`npm run build`) — that one value drives web/vite.config.js's `base`
# (so the built HTML/JS reference "/liveavatar/..."-prefixed asset URLs,
# matching the `alias` below) and this repo's own demo's apiBaseUrl/basePath
# (web/src/main.js). This file only handles the nginx side.
#
# Requires upstream.conf (for the /liveavatar/api/ proxy_pass target below)
# to already be included at the http {} level.

location = /liveavatar {
    return 301 /liveavatar/;
}

location /liveavatar/ {
    # Must be the absolute path to this repo's web/dist/ (built via
    # `npm run build`) on whatever machine nginx runs on.
    alias /path/to/liveavatar/web/dist/;

    # $uri.html lets /liveavatar/demo resolve to dist/demo.html (this repo
    # has two built pages, index.html and demo.html — see docs/api.md).
    # The final fallback to index.html is what makes client-side routes
    # like /liveavatar/avatar/<id> work on a hard reload/direct visit: no
    # matching file exists on disk for those, so nginx serves the app shell
    # and JS takes over from there.
    try_files $uri $uri.html $uri/ /liveavatar/index.html;
}

location /liveavatar/api/ {
    # No URI part on proxy_pass — passes /liveavatar/api/... straight
    # through unmodified. No rewrite needed: the backend's BASE_PATH (see
    # above) already makes it expect exactly this path.
    proxy_pass http://liveavatar_backend;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 60s;
}
